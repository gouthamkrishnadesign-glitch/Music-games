<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Note Friends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&family=Noto+Music&family=Noto+Serif:ital,wght@1,700&display=swap">
<style>
/* Layout: night-sky "music land". Teaching stage on the left; right rail = Quiz Zone on top, topic list below. Dark only, by request. */
:root{
  color-scheme:dark;
  --bg:#10132b; --bg2:#171b3a; --card:#1f2450; --line:#323a7a; --ink:#f5f2ff; --muted:#aab0e6;
  --staff:#ece9ff; --star:#ffd23f; --good:#5ee39a; --oops:#ff8fa3; --pink:#ff7ad9; --handc:#c9b8ff;
  --key:#f7f4ff; --keyb:#262a52; --dark:#161a33;
  --c:#ff5e5b; --d:#ff9f40; --e:#ffd23f; --f:#5ee36b; --g:#3fd0e8; --a:#6b95ff; --b:#b783ff;
  --font-display:'Baloo 2','Nunito',ui-rounded,system-ui,sans-serif;
  --font-body:'Nunito',ui-rounded,system-ui,sans-serif;
  --font-music:'Noto Music','Apple Symbols','Segoe UI Symbol',serif;
  --font-dyn:'Noto Serif',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.45;
  background-image:
    radial-gradient(circle at 12% 18%,rgba(255,255,255,.55) 0 1px,transparent 2px),
    radial-gradient(circle at 78% 8%,rgba(255,255,255,.45) 0 1px,transparent 2px),
    radial-gradient(circle at 46% 62%,rgba(255,255,255,.3) 0 1px,transparent 2px),
    radial-gradient(circle at 90% 70%,rgba(255,210,63,.5) 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 30% 88%,rgba(183,131,255,.5) 0 1.5px,transparent 2.5px),
    radial-gradient(1200px 600px at 85% -10%,rgba(107,149,255,.18),transparent 70%),
    radial-gradient(900px 500px at -10% 110%,rgba(255,122,217,.12),transparent 70%);
  background-size:230px 230px,310px 310px,270px 270px,420px 420px,380px 380px,100% 100%,100% 100%;
  background-attachment:fixed;
}
button{font:inherit;color:inherit}
input{font:inherit}
:focus-visible{outline:3px solid var(--star);outline-offset:3px;border-radius:12px}
.app{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:12px 28px;display:flex;flex-direction:column;gap:16px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:30px}
.brand svg{width:42px;height:42px}
.tools{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}
.jar{display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:800;font-size:22px;background:var(--card);border:2px solid var(--line);padding:4px 14px;border-radius:999px}
.jar svg{width:24px;height:24px;fill:var(--star)}
.jar.bump{animation:notePop .5s cubic-bezier(.3,1.6,.5,1)}
.iconbtn{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-family:var(--font-display);font-weight:700;font-size:16px;cursor:pointer}
.iconbtn[aria-pressed="false"]{opacity:.6}

/* shell */
.shell{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
body.hide-side .shell{grid-template-columns:minmax(0,1fr)}
body.hide-side .side{display:none}
main{display:flex;flex-direction:column;gap:18px;min-width:0}

/* right rail */
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;padding-bottom:12px}
.rail-sec{background:var(--bg2);border:2px solid var(--line);border-radius:24px;padding:14px}
.rail-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.rail-h b{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1}
.rail-h span{color:var(--muted);font-size:14px;font-weight:700}
.qz{background:linear-gradient(160deg,color-mix(in srgb,var(--b) 30%,var(--bg2)),var(--bg2) 70%);border-color:color-mix(in srgb,var(--b) 60%,var(--line))}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qtile{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:14px;background:var(--card);border:2px solid transparent;cursor:pointer;text-align:left;font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.1;min-width:0}
.qtile:hover{border-color:var(--qc)}
.qtile[aria-current="page"]{border-color:var(--qc);background:color-mix(in srgb,var(--qc) 18%,var(--card))}
.qtile .qi{width:34px;height:34px;border-radius:10px;background:var(--qc);display:grid;place-items:center;flex:0 0 auto}
.qtile .qi svg{width:24px;height:24px}
.qtile .tn{min-width:0}
.qtile .tr{display:block;color:var(--star);font-size:12px}
.qtile.wide{grid-column:1/-1;justify-content:center;background:var(--star);color:var(--dark)}
.qtile.wide .qi{background:var(--dark)}
.prog{height:12px;border-radius:999px;background:var(--card);overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--e),var(--f),var(--g),var(--b));border-radius:999px;transition:width .4s}
.unit{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.unit-h{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:4px 0 2px}
.unit-h i{width:10px;height:10px;border-radius:50%;background:var(--uc)}
.tbtn{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:14px;background:transparent;border:2px solid transparent;cursor:pointer;text-align:left;font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.15;color:var(--ink)}
.tbtn:hover{background:var(--card)}
.tbtn .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--uc);color:var(--ink);font-size:14px;flex:0 0 auto}
.tbtn.done .n{background:var(--uc);color:var(--dark)}
.tbtn[aria-current="page"]{background:var(--card);border-color:var(--uc)}
.tbtn .ck{margin-left:auto;width:20px;height:20px;flex:0 0 auto}
.scrim{display:none}

/* stage */
.head .eyebrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-family:var(--font-display);font-weight:700;font-size:15px;margin-bottom:6px}
.unitchip{background:var(--uc);color:var(--dark);border-radius:999px;padding:2px 12px;font-weight:800;letter-spacing:.04em}
.head h2{font-family:var(--font-display);font-weight:800;font-size:clamp(32px,4.4vw,54px);line-height:1.05;margin:0;text-wrap:balance}
.head .lead{margin:.35em 0 0;color:var(--muted);font-size:clamp(18px,2vw,22px);max-width:62ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font-family:var(--font-display);font-weight:700;font-size:19px;padding:9px 20px;border-radius:999px;background:var(--card);border:2px solid var(--line);cursor:pointer;transition:transform .12s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--star);border-color:var(--star);color:var(--dark)}
.btn.small{font-size:16px;padding:5px 14px}
.btn svg{width:20px;height:20px}
.chip{font-family:var(--font-display);font-weight:700;font-size:16px;padding:6px 14px;border-radius:999px;background:transparent;border:2px solid var(--line);cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--a);border-color:var(--a);color:#fff}
.lbl{font-family:var(--font-display);font-weight:700;color:var(--muted);font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
.say{font-family:var(--font-display);font-weight:700;font-size:clamp(21px,2.6vw,30px);line-height:1.25;background:var(--bg2);border:2px solid var(--line);border-radius:26px;padding:12px 22px;min-height:2.2em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.say.pop{animation:sayPop .35s ease}
.say .tag{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;border-radius:50%;background:var(--nc,var(--star));color:var(--dark);font-weight:800}
.say .from{font-size:.6em;background:var(--card);border-radius:999px;padding:2px 10px;color:var(--muted)}
.hl{color:var(--star)}
.muted{color:var(--muted)}
@keyframes sayPop{0%{transform:scale(.97)}60%{transform:scale(1.015)}100%{transform:scale(1)}}
.panel{background:color-mix(in srgb,var(--bg2) 82%,transparent);border:2px solid var(--line);border-radius:28px;padding:16px;min-width:0}
.svgwrap{overflow-x:auto;min-width:0}
.twoup{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.mini{display:flex;align-items:center;gap:14px;background:var(--bg2);border:2px solid var(--line);border-radius:22px;padding:10px 16px;min-width:0}
.mini>svg{width:120px;flex:0 0 auto}
.mini b{font-family:var(--font-display);font-size:22px;display:block;line-height:1.15}
.mini span{color:var(--muted)}
.mini.bounce>svg{animation:bounce .5s cubic-bezier(.3,1.7,.5,1)}

/* staff + keys */
svg.staff{width:100%;max-width:980px;height:auto;display:block;margin:0 auto;touch-action:manipulation}
.sl{stroke:var(--staff);stroke-width:2.6;stroke-linecap:round}
.sl.lit{stroke:var(--star);stroke-width:6}
.ledger{stroke:var(--staff);stroke-width:2.6;stroke-linecap:round}
.barl{stroke:var(--staff);stroke-width:2.6}
.barthick{fill:var(--staff)}
.glow-line{stroke:var(--star);stroke-width:16;stroke-linecap:round;opacity:.35;animation:pulse 1.2s ease-in-out infinite}
.glow-space{fill:var(--star);opacity:.16;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.clef{fill:var(--staff);font-family:var(--font-music)}
.clef.glow{fill:var(--star)}
.tsig{fill:var(--staff);font-family:var(--font-display);font-weight:800;font-size:64px;text-anchor:middle}
.tsig.glow{fill:var(--star)}
.note,.rest{--nc:var(--staff);transform-box:fill-box;transform-origin:center}
.note.now,.rest.now{--nc:var(--star)}
.note.now .head{filter:drop-shadow(0 0 9px var(--star))}
.head.fill{fill:var(--nc);stroke:rgba(10,10,30,.45);stroke-width:2}
.head.hollow{fill:color-mix(in srgb,var(--nc) 22%,transparent);stroke:var(--nc);stroke-width:5}
.stem{stroke:var(--nc);stroke-width:3.2;stroke-linecap:round}
.flag{fill:none;stroke:var(--nc);stroke-width:5;stroke-linecap:round}
.beam{fill:var(--nc)}
.dot{fill:var(--nc)}
.nl{font-family:var(--font-display);font-weight:800;font-size:18px;text-anchor:middle;pointer-events:none;fill:var(--dark)}
.nl.hol{fill:var(--ink)}
.note.pop{animation:notePop .45s cubic-bezier(.3,1.6,.5,1)}
.rest rect,.rest circle{fill:var(--nc)}
.rest .rq{fill:none;stroke:var(--nc);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.tie{fill:var(--tc,var(--staff))}
.stacc{fill:var(--pink)}
.acc line,.acc path{stroke:var(--nc);stroke-width:2.6;fill:none;stroke-linecap:round}
.acc line.th{stroke-width:5}
.ferm{fill:none;stroke:var(--pink);stroke-width:4;stroke-linecap:round}
.blabel{fill:#fff;font-family:var(--font-display);font-weight:800;font-size:13px;text-anchor:middle;pointer-events:none}
.symbig{font-family:var(--font-display);font-weight:800;font-size:96px;line-height:1;color:var(--pink);text-align:center}
.check{display:flex;align-items:center;gap:12px;background:var(--bg2);border:2px solid var(--line);border-radius:20px;padding:10px 16px;cursor:pointer;text-align:left;font-family:var(--font-display);font-weight:700;font-size:20px;width:100%}
.check .box{width:34px;height:34px;border-radius:10px;border:3px solid var(--muted);flex:0 0 auto;display:grid;place-items:center}
.check.on{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--bg2))}
.check.on .box{background:var(--good);border-color:var(--good)}
.blockrow{display:flex;gap:8px;flex-wrap:wrap;min-height:70px;align-items:center;padding:8px;border-radius:18px;border:2px dashed var(--line)}
.rblock{border:0;border-radius:16px;padding:10px 16px;font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--dark);cursor:pointer;background:var(--rc)}
.rblock.now{outline:4px solid var(--star);transform:scale(1.08)}
.count{fill:var(--muted);font-family:var(--font-display);font-weight:800;font-size:22px;text-anchor:middle}
.count.r{opacity:.55}
.count.now{fill:var(--star)}
.syl{fill:var(--muted);font-family:var(--font-display);font-weight:700;font-size:17px;text-anchor:middle}
.dyn{fill:var(--pink);font-family:var(--font-dyn);font-style:italic;font-weight:700;font-size:34px;text-anchor:middle}
.hairpin{stroke:var(--pink);stroke-width:3.5;fill:none;stroke-linecap:round}
.gap{fill:color-mix(in srgb,var(--star) 10%,transparent);stroke:var(--star);stroke-width:3;stroke-dasharray:8 7}
.gapq{fill:var(--star);font-family:var(--font-display);font-weight:800;font-size:48px;text-anchor:middle}
.ghost{fill:none;stroke:var(--star);stroke-width:3;stroke-dasharray:5 5;animation:pulse 1s infinite}
@keyframes notePop{0%{transform:scale(.2)}100%{transform:scale(1)}}
.hit{fill:transparent;cursor:pointer}
.hit:hover{fill:rgba(255,255,255,.07)}
.num circle{fill:var(--card);stroke:var(--staff);stroke-width:2}
.num text{fill:var(--ink);font-family:var(--font-display);font-weight:800;font-size:17px;text-anchor:middle}
.snum{fill:var(--muted);font-family:var(--font-display);font-weight:700;font-size:15px;text-anchor:middle}
.callout{fill:var(--star);font-family:var(--font-display);font-weight:800;font-size:24px;text-anchor:middle}
.brace{fill:none;stroke:var(--staff);stroke-width:5;stroke-linecap:round}
svg.keys{width:100%;max-width:980px;height:auto;display:block;margin:0 auto;touch-action:manipulation;user-select:none}
.key{cursor:pointer;transform-box:fill-box;transform-origin:center top}
.key.white rect{stroke:#9aa0d0;stroke-width:1.5}
.key.black rect{stroke:#0b0d20;stroke-width:1.5}
.key:active rect{filter:brightness(.88)}
.klabel{font-family:var(--font-display);font-weight:800;font-size:18px;text-anchor:middle;pointer-events:none}
.kf{fill:var(--star);stroke:var(--dark);stroke-width:2}
.kft{fill:var(--dark);font-family:var(--font-display);font-weight:800;font-size:17px;text-anchor:middle;pointer-events:none}
.mc{fill:var(--star);font-family:var(--font-display);font-weight:800;font-size:14px;text-anchor:middle}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes bounce{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-16px) scale(1.08,.95)}100%{transform:translateY(0) scale(1)}}

/* friends */
.friends{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.friend{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:24px;min-width:0}
.friend:hover{background:rgba(255,255,255,.04)}
.friend svg{width:min(120px,100%);height:auto}
.friend .L{font-family:var(--font-display);font-weight:800;font-size:clamp(32px,4.6vw,54px);line-height:1;color:var(--nc)}
.friend .w{color:var(--muted);font-weight:700;font-size:15px}
.friend.bounce svg{animation:bounce .5s cubic-bezier(.3,1.7,.5,1)}
.friend.on{background:color-mix(in srgb,var(--nc) 16%,transparent)}
.loop{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.loop .c{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:26px;background:var(--nc);color:var(--dark)}
.loop .arrow{font-family:var(--font-display);font-weight:800;color:var(--star);font-size:19px;padding-inline:6px}

/* cards (note values, rests, dynamics...) */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.vcard{background:var(--bg2);border:2px solid var(--line);border-radius:22px;padding:10px 12px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;transition:transform .15s;min-width:0}
.vcard:hover{transform:translateY(-3px)}
.vcard.on{border-color:var(--star);background:color-mix(in srgb,var(--star) 10%,var(--bg2))}
.vcard svg.staff{max-width:150px}
.vcard b{font-family:var(--font-display);font-size:21px;line-height:1.1}
.vcard .sy{font-family:var(--font-display);font-weight:700;color:var(--pink);font-size:18px}
.vcard .ds{color:var(--muted);font-size:15px;line-height:1.3}
.blocks{display:flex;gap:4px;justify-content:center}
.blocks i{width:22px;height:22px;border-radius:6px;background:var(--card);border:2px solid var(--line)}
.blocks i.half{width:10px}
.blocks i.f{background:var(--g);border-color:var(--g)}
.blocks i.lit{background:var(--star);border-color:var(--star);transform:scale(1.15)}
.blocks i.q{background:transparent;border-style:dashed}
.treerow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.treerow .btn{min-width:150px;justify-content:flex-start}
.beats{display:flex;gap:10px;align-items:center}
.beats span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--muted);transition:transform .1s}
.beats span.on{background:var(--star);border-color:var(--star);color:var(--dark);transform:scale(1.18)}
.beats span.one.on{background:var(--c);border-color:var(--c)}
.train{display:flex;flex-wrap:wrap;gap:10px}
.car{display:flex;gap:6px;padding:10px 12px;border-radius:16px;background:var(--card);border:2px solid var(--line);position:relative}
.car::after{content:"";position:absolute;right:-10px;top:50%;width:10px;height:4px;background:var(--line)}
.car:last-child::after{display:none}
.car i{width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--muted)}
.car i.on{background:var(--star);border-color:var(--star)}
.heartbox{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center}
.heart{width:150px;height:135px}
.heart.beat{animation:heartbeat .3s ease-out}
@keyframes heartbeat{0%{transform:scale(1)}30%{transform:scale(1.18)}100%{transform:scale(1)}}
.tapbig{width:210px;height:210px;border-radius:50%;border:6px solid var(--pink);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--pink) 60%,#fff),var(--pink));color:var(--dark);font-family:var(--font-display);font-weight:800;font-size:30px;cursor:pointer;box-shadow:0 10px 0 color-mix(in srgb,var(--pink) 50%,#000);touch-action:manipulation}
.tapbig:active{transform:translateY(6px);box-shadow:0 4px 0 color-mix(in srgb,var(--pink) 50%,#000)}
.tapmeter{display:flex;gap:6px}
.tapmeter i{width:26px;height:26px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.tapmeter i.on{background:var(--good);border-color:var(--good)}
.dynsym{font-family:var(--font-dyn);font-style:italic;font-weight:700;color:var(--pink);font-size:56px;line-height:1}
.dynbig{font-family:var(--font-dyn);font-style:italic;font-weight:700;color:var(--pink);font-size:130px;line-height:1;text-align:center}
.crit{width:90px;height:90px;transition:transform .3s}
.crit.sm{width:56px;height:56px}
.meter{height:22px;border-radius:999px;background:var(--card);overflow:hidden;border:2px solid var(--line)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--f),var(--e),var(--c));transition:width .3s}
.balloon{width:160px;height:200px;display:block;margin:0 auto}
.balloon g{transform-origin:80px 90px;transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
input[type=range]{width:min(420px,100%);accent-color:var(--star);height:30px}
.hand{width:170px;height:170px}
.finger{cursor:pointer}
.finger.on rect{fill:var(--star)}
.fnum{fill:var(--card)}
.ftxt{fill:var(--ink);font-family:var(--font-display);font-weight:800;font-size:17px;text-anchor:middle;pointer-events:none}
.hlabel{fill:var(--dark);font-family:var(--font-display);font-weight:800;font-size:20px;text-anchor:middle}
.mix{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pickrow{display:flex;flex-wrap:wrap;gap:8px}
.pick{background:var(--card);border:3px solid transparent;border-radius:18px;padding:6px 10px;cursor:pointer;display:flex;gap:4px;align-items:center}
.pick[aria-pressed="true"]{border-color:var(--star)}
.pick .lt{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:22px;background:var(--nc);color:var(--dark)}
.pick svg.staff{width:150px}
.eq{font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--star);text-align:center}
.textin{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:20px;min-width:0;width:min(360px,100%)}

/* quiz */
.qpanel{display:flex;flex-direction:column;gap:16px}
.gamebar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.stars{display:flex;gap:4px}
.stars{flex-wrap:wrap}
.stars svg{width:34px;height:34px}
.qpanel .stars svg{width:28px;height:28px}
.stars .off path{fill:none;stroke:var(--line);stroke-width:2}
.stars .on path{fill:var(--star)}
.stars .pop{animation:notePop .5s cubic-bezier(.3,1.6,.5,1)}
.streak{font-family:var(--font-display);font-weight:800;color:var(--d);display:flex;align-items:center;gap:4px}
.streak svg{width:22px;height:22px}
.qv{min-height:120px;display:flex;flex-direction:column;justify-content:center}
.answers,.ansrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
#qa{display:flex;flex-direction:column;gap:10px}
.ansrow .lbl{min-width:110px;text-align:right}
.ans{min-width:64px;height:64px;border-radius:20px;border:3px solid transparent;font-family:var(--font-display);font-weight:800;font-size:28px;cursor:pointer;background:var(--card);color:var(--ink);padding:0 16px;transition:transform .12s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.ans:hover{transform:translateY(-2px)}
.ans.letter{background:var(--nc);color:var(--dark)}
.ans.line{border-color:var(--staff)}
.ans.space{background:transparent;border:3px dashed var(--muted)}
.ans.pic{height:auto;padding:8px;flex-direction:column;font-size:18px}
.ans.pic svg.staff{width:120px}
.ans.pic svg.rcard{width:220px}
.ans.right{border-color:var(--good)!important;box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 40%,transparent)}
.ans.wrong{opacity:.35;animation:shake .4s}
.target{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;font-family:var(--font-display);font-weight:800;font-size:clamp(26px,3.4vw,40px);text-align:center}
.target .big{width:96px;height:96px;border-radius:28px;display:grid;place-items:center;font-size:64px;background:var(--nc);color:var(--dark)}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.slot{width:clamp(46px,8vw,80px);height:clamp(46px,8vw,80px);border-radius:22px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:clamp(28px,4.6vw,46px);background:var(--nc);color:var(--dark)}
.slot.q{background:transparent;border:4px dashed var(--star);color:var(--star)}
.flash{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.soundpair{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.sbtn{width:130px;height:130px;border-radius:30px;background:var(--card);border:3px solid var(--g);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--font-display);font-weight:800;font-size:18px}
.sbtn svg{width:54px;height:54px}

details.teach{border:2px dashed var(--line);border-radius:20px;padding:10px 18px;color:var(--muted)}
details.teach summary{cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--ink)}
details.teach ul{margin:.5em 0 .2em;padding-left:1.2em;max-width:72ch}
details.teach li{margin:.25em 0}
details.teach em{color:var(--star);font-style:normal;font-weight:800}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:6px}
.learned{background:var(--good);border-color:var(--good);color:var(--dark)}
.learned.done{background:transparent;color:var(--good)}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
.party{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,12,30,.72);z-index:50;padding:16px}
.party .box{background:var(--card);border:3px solid var(--star);border-radius:32px;padding:28px 34px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:460px}
.party h3{font-family:var(--font-display);font-weight:800;font-size:44px;margin:0;line-height:1}
.party p{margin:0;color:var(--muted);font-size:20px}
.party .trophy{width:96px;height:96px}

@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);max-height:none;background:var(--bg);z-index:40;padding:16px;transform:translateX(105%);transition:transform .25s;border-left:2px solid var(--line)}
  body.side-open .side{transform:none}
  body.side-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
  body.hide-side .side{display:flex}
}
@media (max-width:720px){
  .friends{grid-template-columns:repeat(4,minmax(0,1fr))}
  .brand{font-size:24px}
  .ans{min-width:54px;height:56px;font-size:24px}
  .ansrow .lbl{min-width:0;width:100%;text-align:center}
  .tapbig{width:170px;height:170px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<canvas id="confetti" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="22" r="16" fill="var(--b)"/><circle cx="14" cy="19" r="2.6" fill="var(--dark)"/><circle cx="26" cy="19" r="2.6" fill="var(--dark)"/><path d="M14 26 Q20 31 26 26" stroke="var(--dark)" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M30 10 L30 2 L37 5" stroke="var(--star)" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <span>Note Friends</span>
    </div>
    <div class="tools">
      <span class="jar" id="jarbox" title="Stars collected"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg><b id="jar">0</b></span>
      <button class="iconbtn" id="snd" aria-pressed="true">Sound on</button>
      <button class="iconbtn" id="fs">Full screen</button>
      <button class="iconbtn" id="sidebtn" aria-controls="side">Topics &amp; quizzes</button>
    </div>
  </header>
  <div class="shell">
    <main id="stage"></main>
    <aside class="side" id="side" aria-label="Quizzes and topics">
      <section class="rail-sec qz"><div class="rail-h"><b>Quiz Zone</b><span id="trophies"></span></div><div class="qgrid" id="qlist"></div></section>
      <section class="rail-sec"><div class="rail-h"><b>Topics</b><span id="progtxt"></span></div><div class="prog"><i id="progbar"></i></div><div id="tlist"></div></section>
    </aside>
  </div>
</div>
<div class="scrim" id="scrim"></div>
